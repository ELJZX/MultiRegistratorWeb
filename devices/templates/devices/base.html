{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MultiRegistrator Web{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'devices/style.css' %}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="{% url 'dashboard' %}">MultiRegistrator<span>Web</span></a>
    <nav>
        <a href="{% url 'dashboard' %}">Устройства</a>
        <a href="/admin/" target="_blank" rel="noopener">Настройки</a>
        <a href="{% url 'api-health' %}" target="_blank" rel="noopener">API</a>
    </nav>
</header>
<main class="page">
    {% block content %}{% endblock %}
</main>
<footer class="footer">
    MultiRegistrator Web — регистратор данных Modbus TCP
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
