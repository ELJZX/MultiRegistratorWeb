name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  python-tests:
    name: Django tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: multiregistrator
          POSTGRES_USER: multiregistrator
          POSTGRES_PASSWORD: multiregistrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multiregistrator -d multiregistrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: ${{ matrix.database == 'postgres' && '127.0.0.1' || '' }}
      DB_PORT: "5432"
      DB_NAME: multiregistrator
      DB_USER: multiregistrator
      DB_PASSWORD: multiregistrator
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Check version consistency
        run: python scripts/check_version.py --current
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django tests
        run: python manage.py test -v 2

  js-tests:
    name: Chart JS tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run JS tests
        run: npm run test:js

  docker-smoke:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_VERSION: ci
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_ALLOWED_HOSTS: "*"
      ARCHIVE_STORAGE: database
      AUDIT_LOG_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config --quiet
      - name: Validate production compose config
        env:
          APP_IMAGE: ghcr.io/example/multiregistrator-web
          APP_VERSION: ci
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_ALLOWED_HOSTS: "*"
          POSTGRES_DB: multiregistrator
          POSTGRES_USER: multiregistrator
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build image
        run: docker build --build-arg APP_VERSION="${APP_VERSION}" --build-arg GIT_REVISION="${GITHUB_SHA}" -t "multiregistrator-web:${APP_VERSION}" .
      - name: Start stack
        run: docker compose up -d --no-build db web poller
      - name: Wait for health and verify API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/health \
              && curl --fail --silent --show-error http://127.0.0.1:8080/api/ready \
              && docker compose exec -T poller python manage.py poller_health --max-age 120; then
              curl --fail --silent --show-error http://127.0.0.1:8080/api/info
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color db migrate web poller
          exit 1
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
