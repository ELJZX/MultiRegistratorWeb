name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string
      project_name:
        required: false
        type: string
        default: multiregistrator
      env_file:
        required: false
        type: string
        default: .env.production
      compose_file:
        required: false
        type: string
        default: docker-compose.prod.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      version:
        description: Image tag to deploy (for example 1.3.0 or sha-abc1234)
        required: true
        type: string
      project_name:
        description: Compose project name
        required: false
        default: multiregistrator
        type: string
      env_file:
        description: Environment file name in the deployment directory
        required: false
        default: .env.production
        type: string
      compose_file:
        description: Compose file to use on the self-hosted runner
        required: false
        default: docker-compose.prod.yml
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-selfhosted
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.environment }}
    runs-on: [self-hosted, Windows, X64, mrw]
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        shell: powershell
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GHCR_TOKEN | docker login ghcr.io -u $env:GHCR_USER --password-stdin

      - name: Stage deployment files
        shell: powershell
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_FILE: ${{ inputs.env_file }}
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DEPLOY_PATH) { throw 'DEPLOY_PATH secret is not set' }
          if (-not $env:ENV_FILE_CONTENT) { throw 'ENV_FILE_CONTENT secret is not set' }
          New-Item -ItemType Directory -Force -Path $env:DEPLOY_PATH | Out-Null
          Copy-Item -LiteralPath 'docker-compose.prod.yml' -Destination $env:DEPLOY_PATH -Force
          Copy-Item -LiteralPath 'docker-compose.selfhosted.yml' -Destination $env:DEPLOY_PATH -Force
          Copy-Item -LiteralPath 'scripts\deploy.ps1' -Destination $env:DEPLOY_PATH -Force
          $envPath = Join-Path $env:DEPLOY_PATH $env:ENV_FILE
          [IO.File]::WriteAllText($envPath, $env:ENV_FILE_CONTENT + "`r`n", (New-Object Text.UTF8Encoding($false)))

      - name: Run deployment
        shell: powershell
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VERSION: ${{ inputs.version }}
          PROJECT_NAME: ${{ inputs.project_name }}
          ENV_FILE: ${{ inputs.env_file }}
          COMPOSE_FILE: ${{ inputs.compose_file }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:DEPLOY_PATH 'deploy.ps1'
          & $script `
            -Version $env:VERSION `
            -EnvFile (Join-Path $env:DEPLOY_PATH $env:ENV_FILE) `
            -ComposeFile (Join-Path $env:DEPLOY_PATH $env:COMPOSE_FILE) `
            -ProjectName $env:PROJECT_NAME

      - name: Log out from GHCR
        if: always()
        shell: powershell
        run: docker logout ghcr.io
