name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, e.g. 1.3.0"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django tests
        env:
          DJANGO_DEBUG: "1"
        run: python manage.py test -v 2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run JS tests
        run: npm run test:js
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Check version consistency
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python scripts/check_version.py "$VERSION"

  prepare:
    name: Resolve image name
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/multiregistrator-web" >> "$GITHUB_OUTPUT"

  build-push:
    name: Build and push image
    needs: [verify, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.version }}
            type=sha,prefix=sha-,format=short
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.verify.outputs.version }}
            GIT_REVISION=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test published image
    needs: [verify, prepare, build-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      DJANGO_SECRET_KEY: release-smoke-secret
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: multiregistrator
      POSTGRES_USER: multiregistrator
      POSTGRES_PASSWORD: multiregistrator
      ARCHIVE_STORAGE: database
      AUDIT_LOG_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Configure smoke environment
        run: |
          echo "APP_IMAGE=${{ needs.prepare.outputs.image }}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${{ needs.verify.outputs.version }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull production stack
        run: docker compose -f docker-compose.prod.yml pull
      - name: Start production stack
        run: docker compose -f docker-compose.prod.yml up -d
      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/health \
              && curl --fail --silent --show-error http://127.0.0.1:8080/api/ready \
              && docker compose -f docker-compose.prod.yml exec -T poller python manage.py poller_health --max-age 120; then
              curl --fail --silent --show-error http://127.0.0.1:8080/api/info
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml logs --no-color db migrate web poller
          exit 1
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down --volumes --remove-orphans

  deploy:
    name: Deploy production
    needs: [verify, build-push, smoke]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      version: ${{ needs.verify.outputs.version }}
      project_name: multiregistratorweb
      env_file: .env.production
      compose_file: docker-compose.selfhosted.yml
    secrets: inherit
